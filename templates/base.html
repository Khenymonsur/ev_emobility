{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CloudRide | Electric Mobility{% endblock %}</title>
  <meta name="description" content="Electric rides, EV rentals, charging, and fleet services for modern African cities.">
  <script>
    (function () {
      try {
        var theme = localStorage.getItem("cloudrideTheme");
        if (!theme && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
          theme = "dark";
        }
        if (theme === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
        if (!sessionStorage.getItem("cloudrideIgnitionComplete")) {
          document.documentElement.classList.add("ignition-pending");
        }
      } catch (error) {
        document.documentElement.classList.add("ignition-pending");
      }
    })();
  </script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body data-bs-spy="scroll" data-bs-target="#mainNav" data-bs-offset="90" tabindex="0">
  {% include "includes/ignition_overlay.html" %}
  {% block content %}{% endblock %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{% static 'js/site.js' %}"></script>
</body>
</html>
